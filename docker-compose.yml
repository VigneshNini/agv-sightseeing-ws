version: "3.8"

x-ros-common: &ros-common
  environment:
    - ROS_DOMAIN_ID=42
    - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
  network_mode: host
  restart: unless-stopped

services:
  ros2-core:
    <<: *ros-common
    build:
      context: .
      dockerfile: docker/Dockerfile.ros2
      target: runtime
    container_name: agv_ros2_core
    volumes:
      - ./src:/ros2_ws/src:ro
      - ./config:/ros2_ws/config:ro
      - ./maps:/ros2_ws/maps:ro
      - agv_logs:/var/log/agv
    command: >
      bash -c "source /ros2_ws/install/setup.bash &&
               ros2 launch agv_bringup agv_full.launch.py"

  dashboard:
    <<: *ros-common
    build:
      context: .
      dockerfile: docker/Dockerfile.ros2
      target: runtime
    container_name: agv_dashboard
    ports:
      - "9090:9090"
      - "8080:8080"
    volumes:
      - agv_logs:/var/log/agv
    command: >
      bash -c "source /ros2_ws/install/setup.bash &&
               ros2 run agv_dashboard web_bridge_node &
               ros2 run agv_dashboard telemetry_logger_node &
               python3 -m http.server 8080 --directory /ros2_ws/install/agv_dashboard/share/agv_dashboard/dashboard"

  simulation:
    <<: *ros-common
    build:
      context: .
      dockerfile: docker/Dockerfile.simulation
    container_name: agv_simulation
    environment:
      - ROS_DOMAIN_ID=42
      - DISPLAY=${DISPLAY:-:0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    profiles:
      - simulation
    command: >
      bash -c "source /ros2_ws/install/setup.bash &&
               ros2 launch agv_bringup agv_simulation.launch.py"

volumes:
  agv_logs:
